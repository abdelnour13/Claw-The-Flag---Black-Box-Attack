<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Black-Box Attack</title>
    <link rel="stylesheet" href="/public/style.css">
    <style>
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }

        .leaderboard-table thead {
            border-bottom: 2px solid #732054;
        }

        .leaderboard-table th {
            color: #B02D3B;
            text-align: left;
            padding: 15px;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .leaderboard-table th:first-child {
            width: 80px;
            text-align: center;
        }

        .leaderboard-table tbody tr {
            border-bottom: 1px solid rgba(115, 32, 84, 0.3);
            transition: all 0.3s ease;
        }

        .leaderboard-table tbody tr:hover {
            background: rgba(176, 45, 59, 0.1);
            transform: translateX(5px);
        }

        .leaderboard-table td {
            padding: 20px 15px;
            color: #00ff41;
        }

        .rank {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            position: relative;
        }

        .rank-1 {
            color: #FFD700;
            text-shadow: 0 0 10px #FFD700;
        }

        .rank-2 {
            color: #C0C0C0;
            text-shadow: 0 0 10px #C0C0C0;
        }

        .rank-3 {
            color: #CD7F32;
            text-shadow: 0 0 10px #CD7F32;
        }

        .rank-1::before {
            content: '🏆';
            position: absolute;
            left: -30px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .team-name {
            font-size: 1.1em;
            font-weight: bold;
            color: #ffffff;
        }

        .score {
            font-size: 1.3em;
            font-weight: bold;
            color: #B02D3B;
            text-shadow: 0 0 5px rgba(176, 45, 59, 0.5);
        }

        .status {
            padding: 5px 12px;
            border-radius: 3px;
            font-size: 0.85em;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-success {
            background: rgba(0, 255, 65, 0.2);
            border: 1px solid #00ff41;
            color: #00ff41;
        }

        .status-failed {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ff0000;
        }

        .submission-id {
            color: #666;
            font-size: 0.8em;
            font-family: monospace;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-top: 30px;
        }

        .stat-box {
            flex: 1;
            background: rgba(176, 45, 59, 0.1);
            border: 1px solid #732054;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            color: #B02D3B;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #00ff41;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-link {
            display: inline-block;
            color: #732054;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid #732054;
            border-radius: 5px;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(115, 32, 84, 0.2);
            color: #B02D3B;
            border-color: #B02D3B;
            box-shadow: 0 0 15px rgba(176, 45, 59, 0.3);
        }

        @media (max-width: 768px) {
            .glitch {
                font-size: 2em;
                letter-spacing: 5px;
            }

            .leaderboard-table th,
            .leaderboard-table td {
                padding: 10px 8px;
                font-size: 0.9em;
            }

            .rank-1::before {
                left: -20px;
            }

            .stats-bar {
                flex-direction: column;
            }
        }

    </style>
</head>
<body>
    <div class="matrix-bg"></div>
    <div class="scanline"></div>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">BLACK-BOX<span style="color: #732054;">_</span></div>
            <div class="nav-links">
                <a href="/exposed" class="nav-link">SUBMISSION</a>
                <a href="/exposed/leaderboard" class="nav-link active">LEADERBOARD</a>
                <a href="/exposed/details" class="nav-link">DETAILS</a>
            </div>
        </div>
    </nav>

    <div class="container container-lg">

        <div class="header">
            <h1 class="glitch">LEADERBOARD</h1>
            <p class="subtitle">TOP ATTACKERS<span class="blink">_</span></p>
        </div>

        <div class="terminal">
            <div class="command-line">&gt; LIVE_RANKINGS</div>

            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>RANK</th>
                        <th>TIME</th>
                        <th>TEAM</th>
                        <th>SCORE</th>
                        <th>STATUS</th>
                        <th>ID</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    {% for entry in entries %}
                        <tr>
                            <td class="rank rank-{{entry.rank}}">{{entry.rank}}</td>
                            <td class="score">{{entry.hour}}</td>
                            <td class="team-name">{{entry.team}}</td>
                            <td class="score">{{"%.2f"|format(100 * entry.score)}}%</td>
                            <td><span class="status">{{entry.status}}</span></td>
                            <td class="submission-id">{{entry.id}}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>

            <div style="text-align: center;">
                <a href="/" class="back-link">&lt; BACK TO CHALLENGE</a>
            </div>
        </div>
    </div>

</body>
</html>
