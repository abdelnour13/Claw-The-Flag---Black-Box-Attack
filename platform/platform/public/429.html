<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Limited - Black-Box Attack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff41;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            z-index: 0;
            pointer-events: none;
            background: 
                linear-gradient(90deg, #00ff41 1px, transparent 1px),
                linear-gradient(#00ff41 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(176, 45, 59, 0.05) 50%,
                transparent 100%
            );
            animation: scan 8s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 700px;
            padding: 40px;
        }

        .error-code {
            font-size: 8em;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 
                0 0 20px #ff0000,
                0 0 40px #ff0000,
                0 0 60px #ff0000;
            margin-bottom: 20px;
            animation: glitch-error 2s infinite;
            letter-spacing: 10px;
        }

        @keyframes glitch-error {
            0%, 90%, 100% {
                transform: translate(0);
                text-shadow: 
                    0 0 20px #ff0000,
                    0 0 40px #ff0000,
                    0 0 60px #ff0000;
            }
            92% {
                transform: translate(-5px, 5px);
                text-shadow: 
                    5px 5px #B02D3B,
                    -5px -5px #732054;
            }
            94% {
                transform: translate(5px, -5px);
                text-shadow: 
                    -5px -5px #B02D3B,
                    5px 5px #732054;
            }
            96% {
                transform: translate(-5px, -5px);
                text-shadow: 
                    5px -5px #B02D3B,
                    -5px 5px #732054;
            }
        }

        .terminal {
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #ff0000;
            border-radius: 10px;
            padding: 40px;
            margin-top: 30px;
            box-shadow: 
                0 0 30px rgba(255, 0, 0, 0.5),
                inset 0 0 30px rgba(255, 0, 0, 0.1);
            position: relative;
            animation: pulse-border 2s ease-in-out infinite;
        }

        @keyframes pulse-border {
            0%, 100% {
                box-shadow: 
                    0 0 30px rgba(255, 0, 0, 0.5),
                    inset 0 0 30px rgba(255, 0, 0, 0.1);
            }
            50% {
                box-shadow: 
                    0 0 50px rgba(255, 0, 0, 0.8),
                    inset 0 0 50px rgba(255, 0, 0, 0.2);
            }
        }

        .terminal::before {
            content: '⚠⚠⚠';
            position: absolute;
            top: 10px;
            left: 15px;
            color: #ff0000;
            font-size: 1em;
            letter-spacing: 5px;
            animation: blink 1s step-start infinite;
        }

        .error-title {
            font-size: 2.5em;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .error-message {
            color: #d0d0d0;
            font-size: 1.1em;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .command-line {
            color: #ff0000;
            margin-bottom: 10px;
            font-size: 1em;
        }

        .info-box {
            background: rgba(255, 0, 0, 0.1);
            border-left: 3px solid #ff0000;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .info-box ul {
            list-style: none;
            padding-left: 0;
        }

        .info-box li {
            padding: 8px 0;
            color: #00ff41;
        }

        .info-box li::before {
            content: '> ';
            color: #ff0000;
            font-weight: bold;
        }

        .countdown {
            font-size: 3em;
            color: #B02D3B;
            font-weight: bold;
            margin: 30px 0;
            text-shadow: 0 0 15px rgba(176, 45, 59, 0.8);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        .retry-btn {
            background: linear-gradient(135deg, #ff0000 0%, #B02D3B 100%);
            color: #ffffff;
            padding: 15px 50px;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.5;
            pointer-events: none;
        }

        .retry-btn.active {
            opacity: 1;
            pointer-events: all;
        }

        .retry-btn.active:hover {
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.8);
            transform: translateY(-2px);
        }

        .back-link {
            display: inline-block;
            color: #732054;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid #732054;
            border-radius: 5px;
            margin-top: 20px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .back-link:hover {
            background: rgba(115, 32, 84, 0.2);
            color: #B02D3B;
            border-color: #B02D3B;
            box-shadow: 0 0 15px rgba(176, 45, 59, 0.3);
        }

        .blink {
            animation: blink 1s step-start infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .highlight {
            color: #ff0000;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 4em;
            }

            .error-title {
                font-size: 1.8em;
                letter-spacing: 4px;
            }

            .terminal {
                padding: 25px;
            }

            .countdown {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="matrix-bg"></div>
    <div class="scanline"></div>

    <div class="container">
        <div class="error-code">429</div>

        <div class="terminal">
            <div class="error-title">ACCESS DENIED<span class="blink">_</span></div>
            
            <div class="error-message">
                <div class="command-line">&gt; ERROR: RATE_LIMIT_EXCEEDED</div>
                <p>Your attack pattern has been detected. Too many requests in a short period.</p>
            </div>

            <div class="info-box">
                <div class="command-line">&gt; RATE_LIMIT_INFO</div>
                <ul>
                    <li>Maximum requests: <span class="highlight">5 per minute</span></li>
                    <li>Current status: <span class="highlight">THROTTLED</span></li>
                </ul>
            </div>

            <!--<div class="error-message">
                <div class="command-line">&gt; TIME_UNTIL_RESET</div>
            </div>

            <div class="countdown" id="countdown">--:--</div>

            <button id="retryBtn" class="retry-btn">
                &gt; RETRY ACCESS
            </button>-->

            <div style="margin-top: 20px;">
                <a href="/" class="back-link">&lt; RETURN TO BASE</a>
            </div>
        </div>
    </div>
</body>
</html>
